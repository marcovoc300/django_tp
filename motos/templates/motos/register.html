{% extends "motos/padre.html" %}

{% block contenidoQueCambia %}
    <div class="container mt-5">
        <div class="row justify-content-center">
            <div class="col-md-5">
                <h2 class="text-center">Crear Cuenta Nueva</h2>
                <form method="POST" class="mt-4 card p-4 shadow-sm">
                    {% csrf_token %}
                    {{ form.as_p }}
                    <button type="submit" class="btn btn-success w-100">Registrarme</button>
                </form>
                <p class="text-center mt-3">¿Ya tenés cuenta? <a href="{% url 'login' %}">Iniciá sesión</a></p>
            </div>
        </div>
    </div>
{% endblock %}
