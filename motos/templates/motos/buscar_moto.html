{% extends "motos/padre.html" %}

{% block contenidoQueCambia %}
    <div class="mt-4">
        <h1>Buscar Moto</h1>
        <p>Ingresá la marca o modelo para filtrar en el catálogo.</p>
        
        <form action="{% url 'buscar_moto' %}" method="GET" class="row g-3">
            <div class="col-auto">
                <input type="text" name="modelo" class="form-control" placeholder="Ej: Svartpilen 401">
            </div>
            <div class="col-auto">
                <button type="submit" class="btn btn-primary">Buscar</button>
            </div>
        </form>

        <hr>
        <a href="{% url 'inicio' %}" class="btn btn-secondary btn-sm">Volver al Inicio</a>
    </div>
{% endblock %}
